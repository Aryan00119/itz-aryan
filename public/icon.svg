<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Obsidian to Royal Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c24" />
      <stop offset="50%" stop-color="#06050e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Monogram 'A' High-Contrast Metallic Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>

    <!-- Crossbar Accent Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Ring -->
  <rect x="2.5" y="2.5" width="123" height="123" rx="30" fill="none" stroke="url(#rimGrad)" stroke-width="3" stroke-opacity="0.9" />

  <!-- Stylized Geometric "A" Monogram -->
  <g transform="translate(64, 63)">
    <!-- Ambient Shadow / Glow -->
    <path
      d="M -30 35 L -6 -35 L 6 -35 L 30 35 L 14 35 L 8 16 L -8 16 L -14 35 Z M -5 3 L 5 3 L 0 -13 Z"
      fill="#7c3aed"
      opacity="0.5"
      filter="url(#softGlow)"
    />

    <!-- Main Bold "A" Glyph -->
    <path
      d="M -30 35 L -6 -35 L 6 -35 L 30 35 L 14 35 L 8 16 L -8 16 L -14 35 Z M -5 3 L 5 3 L 0 -13 Z"
      fill="url(#letterGrad)"
    />

    <!-- Vibrant Futuristic Crossbar Accent -->
    <rect x="-8" y="14" width="16" height="4" rx="2" fill="url(#accentGrad)" />
    <circle cx="0" cy="16" r="2.2" fill="#ffffff" />
  </g>
</svg>
